<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Michael Recipes">
<meta name="theme-color" content="#F7F2E7">
<meta name="description" content="The Michael Family Recipe Box — a shared family recipe box.">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<title>The Michael Family Recipe Box</title>
<style>
  :root{
    --parchment:#F7F2E7;
    --card:#FFFCF6;
    --ink:#2B2318;
    --ink-soft:#6B6152;
    --sage:#5C6E48;
    --sage-dark:#465538;
    --jam:#A2392F;
    --line:#E3D9C4;
    --line-strong:#CDBF9F;
    --gold:#C89B3C;
    --radius:18px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--parchment);color:var(--ink);font-family:'Inter',sans-serif;}
  body{
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(43,35,24,0.055) 1px, transparent 0);
    background-size: 18px 18px;
  }
  #app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(78px + var(--safe-b));}
  html[data-textsize="large"] #app{zoom:1.15;}
  html[data-textsize="xl"] #app{zoom:1.3;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;letter-spacing:-0.01em;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  a{color:var(--sage-dark);}

  /* ---- Header ---- */
  .topbar{
    padding:calc(20px + var(--safe-t)) 20px 14px;
    display:flex;align-items:flex-end;justify-content:space-between;
  }
  .topbar .brand h1{font-size:23px;font-weight:600;color:var(--ink);line-height:1.15;}
  .topbar .brand .tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.09em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px;}
  .iconbtn{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--line-strong);
    background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink);
    flex-shrink:0;
  }
  .iconbtn:active{transform:scale(0.94);}
  .iconbtn.active{background:var(--sage);border-color:var(--sage);color:#fff;}

  /* ---- Search & filters ---- */
  .searchwrap{padding:0 20px 12px;display:flex;gap:8px;align-items:center;}
  .search{
    display:flex;align-items:center;gap:8px;background:var(--card);flex:1;
    border:1px solid var(--line-strong);border-radius:12px;padding:10px 14px;
  }
  .search input{border:none;background:transparent;outline:none;flex:1;font-size:15px;color:var(--ink);}
  .search input::placeholder{color:#A79C86;}
  .chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 14px;scrollbar-width:none;}
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;padding:7px 14px;border-radius:999px;border:1px solid var(--line-strong);
    background:var(--card);font-size:12.5px;font-weight:600;color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.03em;
  }
  .chip.active{background:var(--sage);border-color:var(--sage);color:#fff;}

  /* ---- Recipe grid tiles ---- */
  .tilegrid{padding:4px 20px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;}
  .tile:active{background:#FBF6EC;}
  .tilephoto-wrap{display:contents;}
  .photohero-wrap{display:contents;}
  .tilephoto{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#EFE7D4;}
  .tilephoto.placeholder{display:flex;align-items:center;justify-content:center;color:var(--line-strong);}
  .tilebody{padding:10px 11px 11px;}
  .tiletitle{font-family:'Fraunces',serif;font-size:15px;font-weight:600;line-height:1.22;color:var(--ink);margin-bottom:6px;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;margin-bottom:5px;}
  .tilebody .rmeta{margin-top:4px;}
  .rmeta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;}
  .planbtn{
    position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,0.92);border:1px solid var(--line-strong);
    display:flex;align-items:center;justify-content:center;color:var(--ink);
  }
  .planbtn.active{background:var(--sage);border-color:var(--sage);color:#fff;}

  .empty{padding:60px 30px;text-align:center;color:var(--ink-soft);}

  /* ---- Detail view / photo hero ---- */
  .photohero{width:100%;height:300px;object-fit:cover;display:block;background:#EFE7D4;}
  .photohero.placeholder{display:flex;align-items:center;justify-content:center;font-size:80px;color:#E3D9C4;}
  .detailbody{padding:20px;}
  .detailbody h1{font-size:28px;margin-bottom:8px;line-height:1.15;}
  .metaline{font-size:13px;color:var(--ink-soft);margin-bottom:14px;display:flex;gap:12px;flex-wrap:wrap;}
  .metaline a{color:var(--sage-dark);text-decoration:none;border-bottom:1px solid var(--sage-dark);}
  .sectionlabel{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);margin-top:18px;margin-bottom:8px;}
  .ingline,.stepline{display:flex;gap:10px;margin-bottom:10px;font-size:15px;line-height:1.5;}
  .ingline .dot{width:6px;height:6px;border-radius:50%;background:var(--sage);flex-shrink:0;margin-top:6px;}
  .stepline .stepnum{min-width:24px;text-align:center;color:var(--sage);font-weight:600;flex-shrink:0;}

  /* ---- Add/edit view ---- */
  .screenhead{padding:calc(14px + var(--safe-t)) 20px 8px;display:flex;align-items:center;gap:8px;position:relative;z-index:4;}
  .screenhead h2{flex:1;font-size:18px;margin:0;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field textarea,.field select{
    width:100%;padding:12px;border:1px solid var(--line-strong);border-radius:10px;
    font-size:15px;line-height:1.5;color:var(--ink);background:var(--card);
  }
  .field textarea{resize:vertical;min-height:100px;font-family:inherit;}
  .field select{cursor:pointer;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.4;}
  .urlrow{display:flex;gap:8px;}
  .urlrow input{flex:1;}
  .urlrow button{flex-shrink:0;}
  .photopicker{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .photoopt{
    border:2px solid var(--line-strong);border-radius:12px;overflow:hidden;
    aspect-ratio:1;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;
  }
  .photoopt.empty{flex-direction:column;color:var(--ink-soft);}
  .photoopt.empty input{display:none;}
  .photoopt.selected{border-color:var(--sage);background:rgba(92,110,72,0.08);}
  .photoopt img{width:100%;height:100%;object-fit:cover;}
  .photoopt .lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.6);color:#fff;font-size:11px;padding:4px;text-align:center;}

  /* ---- Buttons ---- */
  .btn{
    border:none;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:600;
    cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line-strong);
    transition:all 0.15s;
  }
  .btn:active{transform:scale(0.98);}
  .btn.primary{background:var(--sage);border-color:var(--sage);color:#fff;}
  .btn.danger{background:#F5E5E3;border-color:#F5E5E3;color:var(--jam);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .actionrow{display:flex;gap:10px;margin-top:20px;}
  .toplink{
    background:none;border:none;color:var(--sage-dark);font-size:13px;
    padding:4px 0;cursor:pointer;text-decoration:underline;font-weight:500;
  }
  .toplink:active{opacity:0.7;}

  /* ---- Status & spinner ---- */
  .status{
    padding:12px;border-radius:10px;background:#F0F0F0;color:var(--ink);font-size:14px;
    display:flex;align-items:center;gap:8px;
  }
  .status.error{background:#F5E5E3;color:var(--jam);}
  .spinner{
    width:16px;height:16px;border:2px solid var(--line-strong);border-top-color:var(--ink);
    border-radius:50%;animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---- Meal plan view ---- */
  .planlist{padding:0 20px;}
  .planrow{
    display:flex;gap:12px;align-items:center;padding:12px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;
  }
  .planrow img{width:56px;height:56px;border-radius:10px;object-fit:cover;}
  .planrow .pt{flex:1;font-size:15px;color:var(--ink);cursor:pointer;}
  .planrow .pt:active{opacity:0.7;}
  .planrow .iconbtn{border-color:var(--line-strong);}

  /* ---- Grocery list ---- */
  .grocerylist{padding:0 20px;}
  .groceryitem{
    display:flex;gap:10px;align-items:flex-start;padding:12px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;
    cursor:pointer;
  }
  .groceryitem:active{background:#FBF6EC;}
  .groceryitem.checked{opacity:0.6;}
  .groceryitem.checked .gcheck{color:var(--sage);}
  .gcheck{
    min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--line-strong);border-radius:4px;color:transparent;font-size:12px;font  weight:600;flex-shrink:0;
  }
  .groceryitem.checked .gcheck{border-color:var(--sage);}
  .grocerysrc{
    display:block;font-size:11px;color:var(--ink-soft);margin-top:2px;font-style:italic;
  }

  /* ---- Category view ---- */
  .catgrid{display:grid;grid-template-columns:1fr;gap:8px;padding:0 20px 20px;}
  .cattile{
    padding:20px;border-radius:14px;cursor:pointer;
    display:flex;flex-direction:column;justify-content:space-between;min-height:100px;
  }
  .cattile:active{opacity:0.85;}
  .cn{font-size:18px;font-weight:600;font-family:'Fraunces',serif;}
  .cc{font-size:13px;opacity:0.8;margin-top:8px;}

  /* ---- Me (profile) tab ---- */
  .profilesection{padding:20px;}
  .profilesection .field{margin-bottom:12px;}
  .profilesection h3{font-size:14px;font-weight:600;margin-top:20px;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);}
  .sizepicker{display:flex;gap:8px;}
  .sizepicker button{flex:1;padding:8px 12px;border:1px solid var(--line-strong);background:var(--card);border-radius:8px;font-size:13px;cursor:pointer;}
  .sizepicker button.active{background:var(--sage);border-color:var(--sage);color:#fff;}

  /* ---- Admin section ---- */
  .adminsection{padding:20px;margin-top:20px;background:rgba(162,57,47,0.05);border:1px solid rgba(162,57,47,0.15);border-radius:12px;}
  .adminsection h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--jam);margin-bottom:12px;}
  .newcatrow{display:flex;gap:8px;}
  .newcatrow input{flex:1;}
  .newcatrow button{flex-shrink:0;}
  .personrow{display:flex;justify-content:space-between;align-items:center;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;}
  .personrow select{max-width:150px;}
  .personrow .danger{font-size:12px;padding:6px 10px;}

  /* ---- Share modal ---- */
  #modalBg{
    position:fixed;inset:0;background:rgba(0,0,0,0.3);display:none;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  #modalBg.active{display:flex;}
  #shareModal{
    background:var(--card);border-radius:20px;padding:20px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;
  }
  #shareModal h2{margin-top:0;margin-bottom:14px;}
  #shareModal .field{margin-bottom:12px;}
  #shareModal textarea{height:100px;min-height:100px;}
  #shareModal .btnrow{display:flex;gap:8px;margin-top:14px;}
  #shareModal .btnrow button{flex:1;padding:10px 12px;font-size:13px;}

  /* ---- Splash screen ---- */
  .splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center;}
  .splash h1{margin:20px 0 12px;font-size:32px;}
  .splash .field{max-width:300px;margin:20px auto 0;}
  .splash .btn{width:100%;}
  .splash .loading{display:flex;align-items:center;gap:8px;}

  /* ---- Tab bar ---- */
  .tabbar{
    position:fixed;bottom:0;left:0;right:0;display:flex;border-top:1px solid var(--line);
    background:var(--parchment);z-index:10;padding-bottom:var(--safe-b);
  }
  .tab{
    flex:1;padding:10px;text-align:center;border:none;background:none;cursor:pointer;
    font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;
    color:var(--ink-soft);
  }
  .tab.active{color:var(--sage);}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalBg">
  <div id="shareModal"></div>
</div>

<script type="module">
import {
  initializeApp
} from 'https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js';
import { 
  getAuth, signInAnonymously, onAuthStateChanged, connectAuthEmulator
} from 'https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js';
import { 
  getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy,
  arrayUnion, arrayRemove, connectFirestoreEmulator
} from 'https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js';
import { 
  getStorage, ref, uploadString, getDownloadURL, deleteObject, connectStorageEmulator
} from 'https://www.gstatic.com/firebasejs/10.4.0/firebase-storage.js';
import firebaseConfig from './firebase-config.js';

window.CATEGORY_STYLE = {
  "Breakfast": {bg:"#D4EBD9",fg:"#1B4D1B"},
  "Main Dish": {bg:"#E8D5C4",fg:"#6B3E1F"},
  "Side Dish": {bg:"#C8E6C9",fg:"#2E5F2E"},
  "Soup": {bg:"#F0D4D4",fg:"#8B3A3A"},
  "Salad": {bg:"#D9E8D1",fg:"#4A6D3C"},
  "Sauce": {bg:"#F5DDB0",fg:"#8B6914"},
  "Dessert": {bg:"#F5D7E8",fg:"#9B3D7F"},
  "Baking & Bread": {bg:"#F5E3D0",fg:"#9B5E2E"},
  "Drinks": {bg:"#C8E2F0",fg:"#1F5E8B"},
  "Appetizer & Snack": {bg:"#E0D4F0",fg:"#5B3D8B"},
  "Other": {bg:"#E3E3E3",fg:"#6B6152"},
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const ADMIN_NAMES = ['ramy', 'jennifer'];
const WORKER_URL = 'https://recipe-box-worker.romburgundy.workers.dev';
let recipes = [];

if (location.hostname === 'localhost'){
  connectAuthEmulator(auth, 'http://localhost:9099', { disableWarnings: true });
  connectFirestoreEmulator(db, 'localhost', 8080);
  connectStorageEmulator(storage, 'localhost', 9199);
}

let state = {
  loading: true,
  authReady: false,
  profile: null,
  view: 'list',
  filter: 'all',
  categoryFilter: null,
  sort: loadSort(),
  query: '',
  recipes: [],
  roster: [],
  customCategories: {},
  mealPlanIds: [],
  groceryItems: null,
  groceryLoading: false,
  groceryError: null,
  detail: null,
  editingId: null,
  form: null,
  extractStatus: null,
  saving: false,
  shareModal: null,
  textSize: loadTextSize(),
  // NEW: Track if form data was synced since last render
  lastFormSyncTime: 0,
};

function render(){
  const active = document.activeElement;
  const appEl = document.getElementById('app');
  let focusInfo = null;
  if (active && active.id && appEl.contains(active)){
    focusInfo = { id: active.id, start: active.selectionStart, end: active.selectionEnd };
  }
  appEl.innerHTML = viewFor(state);
  // Restore focus and cursor position
  if (focusInfo){
    const el = document.getElementById(focusInfo.id);
    if (el){
      el.focus();
      if (typeof el.setSelectionRange === 'function' && focusInfo.start != null){
        try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
      }
    }
  }
}

/* BUG FIX #1-4: Only re-render Firestore listeners if not actively editing a form */
function shouldRenderOnFirestoreUpdate(){
  // Don't re-render if user is actively typing in a form
  return !state.editingId && !state.form;
}

/* ---- Profile (local to this device) ---- */
function loadProfile(){
  try{ const v = localStorage.getItem('recipebox_profile'); return v ? JSON.parse(v) : null; }
  catch(e){ return null; }
}
function saveProfile(p){ localStorage.setItem('recipebox_profile', JSON.stringify(p)); }

async function registerInRoster(name){
  try{ await setDoc(doc(db,'meta','roster'), { names: arrayUnion(name) }, { merge:true }); }catch(e){ console.error(e); }
}

function loadSort(){
  try{ const v = localStorage.getItem('recipebox_sort'); return v ? JSON.parse(v) : null; }
  catch(e){ return null; }
}
function saveSort(s){ localStorage.setItem('recipebox_sort', JSON.stringify(s)); }

function loadTextSize(){
  try{ const v = localStorage.getItem('recipebox_textsize'); return v || 'normal'; }
  catch(e){ return 'normal'; }
}
function saveTextSize(s){
  localStorage.setItem('recipebox_textsize', s);
  const html = document.documentElement;
  html.dataset.textsize = s;
}

async function createCategory(name){
  if (!name || !name.trim()) return;
  const list = Object.entries(state.customCategories).map(([nm, sty]) => ({name:nm, bg:sty.bg, fg:sty.fg}));
  const [r,g,b] = [Math.random()*200+55|0, Math.random()*200+55|0, Math.random()*200+55|0];
  const bg = `rgb(${r},${g},${b})`, fg = `rgb(255,255,255)`;
  list.push({name: name.trim(), bg, fg});
  try{
    await setDoc(doc(db,'meta','categories'), {list});
  }catch(e){
    console.error(e);
    alert('Could not create category.');
  }
}

/* ---- API calls (via Worker) ---- */
async function authHeader(){
  const tok = await auth.currentUser.getIdToken();
  return { 'Authorization': `Bearer ${tok}` };
}

async function extractFromUrl(url){
  const cats = allCategoryNames(state);
  const res = await fetch(WORKER_URL + '/extract-url', {
    method: 'POST',
    headers: Object.assign({'Content-Type':'application/json'}, await authHeader()),
    body: JSON.stringify({url, categories: cats})
  });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || 'Failed to extract.');
  return data;
}
async function extractFromImage(dataUrl, mediaType){
  const cats = allCategoryNames(state);
  const base64Data = dataUrl.split(',')[1];
  const res = await fetch(WORKER_URL + '/extract-image', {
    method: 'POST',
    headers: Object.assign({'Content-Type':'application/json'}, await authHeader()),
    body: JSON.stringify({data: base64Data, mediaType, categories: cats})
  });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || 'Failed to extract.');
  return data;
}
async function extractFromText(text){
  const cats = allCategoryNames(state);
  const res = await fetch(WORKER_URL + '/extract-text', {
    method: 'POST',
    headers: Object.assign({'Content-Type':'application/json'}, await authHeader()),
    body: JSON.stringify({text, categories: cats})
  });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || 'Failed to extract.');
  return data;
}

// BUG FIX #6: Improved aggregateGroceryItems with better error handling
async function aggregateGroceryItems(items){
  const headers = Object.assign({'Content-Type':'application/json'}, await authHeader());
  try {
    const res = await fetch(WORKER_URL + '/aggregate-grocery', {
      method: 'POST',
      headers,
      body: JSON.stringify({ items })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Aggregation failed');
    if (!data.items || !Array.isArray(data.items)) throw new Error('Invalid response format');
    return data.items;
  } catch (error) {
    console.error('Aggregation error:', error);
    // Re-throw to be caught by handleGenerateGrocery
    throw error;
  }
}

/* ---- Photo storage (Firebase Storage) ---- */
async function uploadOwnPhoto(id, dataUrl){
  const r = ref(storage, `recipes/${id}/own.jpg`);
  await uploadString(r, dataUrl, 'data_url');
  return await getDownloadURL(r);
}
async function deleteOwnPhoto(id){
  try{ await deleteObject(ref(storage, `recipes/${id}/own.jpg`)); }catch(e){}
}

/* ---- View renderers ---- */
const ICON = {
  back:'←',list:'📋',mealplan:'🍽️',me:'👤',add:'➕',
  search:'🔍',filter:'🎯',categories:'📂',trash:'🗑️',
  pencil:'✏️',check:'✔',cart:'🛒',share:'↗️',camera:'📷',
  pot:'🍲',wand:'✨',close:'✕',
};

function esc(s){ const d = new DOMParser().parseFromString(s,'text/html'); return d.body.textContent||''; }
function uid(){ return Math.random().toString(36).slice(2); }
function fmtDate(ts){ if (!ts) return ''; const d = new Date(ts.seconds*1000); return d.toLocaleDateString(); }
function newForm(){ return { title:'', sourceUrl:'', sourceImageUrl:'', ownPhotoDataUrl:'', chosenPhoto:'source', ingredients:[], instructions:[], ingredientsText:'', instructionsText:'', category:null, addedBy:'' }; }

function isAdmin(s){ return s.profile && s.profile.name && ADMIN_NAMES.includes(s.profile.name.toLowerCase()); }
function allCategoryNames(s){ return [...Object.keys(CATEGORY_STYLE), ...Object.keys(s.customCategories)]; }
function allCategoryStyles(s){ return {...CATEGORY_STYLE, ...s.customCategories}; }

function viewFor(s){
  if (!s.authReady) return `<div class="splash"><div class="loading"><div class="spinner"></div> Checking auth…</div></div>`;
  if (!s.profile) return splashView(s);
  const views = {list:listView, detail:detailView, add:addView, categories:categoriesView, mealplan:mealPlanView, grocery:groceryView, me:meView};
  const v = views[s.view] || listView;
  return v(s) + tabBar(s);
}

function splashView(s){

function tabBar(s){

function listView(s){
  let filtered = s.recipes;
  if (s.query) filtered = filtered.filter(r => (r.title||'').toLowerCase().includes(s.query.toLowerCase()));
  if (s.categoryFilter) filtered = filtered.filter(r => r.category === s.categoryFilter);
  if (s.filter === 'mine') filtered = filtered.filter(r => (r.addedBy||'').trim() === (s.profile.name||'').trim());
  
  const sorted = filtered.sort((a, b) => {
    if (!s.sort || s.sort === 'recent') return (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0);
    return (a.title||'').localeCompare(b.title||'');
  });
  
  const tiles = sorted.map(r => {
    const thumb = r.chosenPhoto === 'own' ? r.ownPhotoUrl : (r.sourceImageUrl || r.ownPhotoUrl);
    const st = allCategoryStyles(s)[r.category] || CATEGORY_STYLE.Other;
    const inPlan = s.mealPlanIds.includes(r.id);
    return `
    <div class="tile" data-open="${r.id}">
      ${thumb ? `<img class="tilephoto" src="${esc(thumb)}" onerror="this.style.display='none';">` : `<div class="tilephoto placeholder">${ICON.pot}</div>`}
      <div class="tilebody">
        <div class="tiletitle">${esc(r.title)}</div>
        ${r.category ? `<span class="badge" style="background:${st.bg};color:${st.fg};">${esc(r.category)}</span>` : ''}
        <div class="rmeta">${esc(r.addedBy||'?')} · ${fmtDate(r.createdAt)}</div>
      </div>
      <button class="planbtn ${inPlan?'active':''}" data-toggleplan="${r.id}" title="${inPlan?'Remove from meal plan':'Add to meal plan'}">${inPlan ? ICON.check : ICON.plus}</button>
    </div>`;
  }).join('');

  const viewLayout = `
  <div class="topbar"><div class="brand"><h1>Recipes</h1><div class="tag">Shared family cooking</div></div></div>
  <div class="searchwrap">
    <div class="search"><span>${ICON.search}</span><input id="searchInput" type="text" placeholder="Search…" value="${esc(s.query)}"></div>

  <div class="chiprow">
    <button class="chip ${s.filter==='all'?'active':''}" data-filter="all">All</button>
    <button class="chip ${s.filter==='mine'?'active':''}" data-filter="mine">My recipes</button>
    ${s.categoryFilter ? `<button class="chip active" data-clear-category>×${esc(s.categoryFilter)}</button>` : ''}
  </div>
  ${s.categoryFilter ? `<div style="padding:0 20px;margin-bottom:8px;"><button class="toplink" data-clear-category>Show all categories</button></div>` : ''}
  ${sorted.length ? `<div class="tilegrid">${tiles}</div>` : `<div class="empty"><h3>No recipes yet</h3><p>Tap + to add one, or ask someone to share theirs.</p></div>`}
  `;
  return viewLayout;

/* ---- Firestore live sync (with guard to avoid wiping form state) ---- */
let lastRecipeSync = {};
function startRecipeSync(){
  const q = query(collection(db, 'recipes'), orderBy('createdAt', 'desc'));
  onSnapshot(q, snap => {
    state.recipes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.loading = false;
    if (state.view === 'detail' && state.detail){
      const updated = state.recipes.find(r => r.id === state.detail.id);
      if (updated) state.detail = updated;
    }
    // BUG FIX: Only render if not actively editing
    if (shouldRenderOnFirestoreUpdate()) {
      render();
    }
  }, err => {
    console.error(err);
    state.loading = false;
    if (shouldRenderOnFirestoreUpdate()) {
      render();
    }
  });
}

function startRosterSync(){
  onSnapshot(doc(db,'meta','roster'), snap => {
    state.roster = (snap.exists() && snap.data().names) || [];
    // BUG FIX: Only render if not actively editing
    if (shouldRenderOnFirestoreUpdate()) {
      render();
    }
  }, err => console.error(err));
}

function startCategoriesSync(){
  onSnapshot(doc(db,'meta','categories'), snap => {
    const list = (snap.exists() && snap.data().list) || [];
    state.customCategories = Object.fromEntries(list.map(c => [c.name, {bg:c.bg, fg:c.fg}]));
    // BUG FIX: Only render if not actively editing
    if (shouldRenderOnFirestoreUpdate()) {
      render();
    }
  }, err => console.error(err));
}

function startMealPlanSync(uid){
  onSnapshot(doc(db,'mealplans',uid), snap => {
    state.mealPlanIds = (snap.exists() && snap.data().recipeIds) || [];
    // BUG FIX: Only render if not actively editing
    if (shouldRenderOnFirestoreUpdate()) {
      render();
    }
  }, err => console.error(err));
}

/* ---- Boot ---- */
onAuthStateChanged(auth, user => {
  if (!user){
    signInAnonymously(auth).catch(e => {
      console.error('Auth error:', e);
      state.loading = false;
      state.authReady = true;
      render();
    });
    return;
  }
  state.authReady = true;
  let p = loadProfile();
  if (!p){
    render();
    return;
  }
  state.profile = p;
  state.recipes = [];
  startRecipeSync();
  startRosterSync();
  startCategoriesSync();
  startMealPlanSync(user.uid);
  registerInRoster(p.name);
  render();
});

function goList(){ state.view='list'; state.detail=null; state.editingId=null; state.form=null; state.extractStatus=null; render(); }

/* ---- Handle recipe save ---- */
async function handleSave(){
  const f = state.form;
  if (!f || !f.title || !f.title.trim()){
    alert('Recipe needs a title.');
    return;
  }
  state.saving = true;
  render();
  
  const id = state.editingId || uid();
  const ingredients = (f.ingredientsText || '').split('\n').map(l => l.trim()).filter(Boolean);
  const instructions = (f.instructionsText || '').split('\n').map(l => l.trim()).filter(Boolean);
  
  let ownPhotoUrl = null;
  try{
    if (f.ownPhotoDataUrl && f.ownPhotoDataUrl.startsWith('data:')){
      ownPhotoUrl = await uploadOwnPhoto(id, f.ownPhotoDataUrl);
    } else if (state.detail && state.detail.ownPhotoUrl){
      ownPhotoUrl = state.detail.ownPhotoUrl;
    }
  }catch(e){
    console.error('Photo upload failed:', e);
  }

  const recipeDoc = {
    title: f.title.trim(),
    sourceUrl: f.sourceUrl || null,
    sourceImageUrl: f.sourceImageUrl || null,
    ownPhotoUrl,
    chosenPhoto: f.chosenPhoto || 'source',
    ingredients,
    instructions,
    category: f.category || 'Other',
    addedBy: f.addedBy || state.profile.name,
    ...(state.editingId ? {} : { createdAt: new Date() })
  };
  
  try{
    await setDoc(doc(db, 'recipes', id), recipeDoc, { merge: !state.editingId });
    state.saving = false;
    goList();
  }catch(e){
    console.error(e);
    state.saving = false;
    alert('Could not save recipe.');
    render();
  }
}

async function handleDelete(){
  const r = state.detail;
  if (!r) return;
  if (!confirm(`Delete "${r.title}"?`)) return;
  try{
    if (r.ownPhotoUrl) await deleteOwnPhoto(r.id);
    await deleteDoc(doc(db, 'recipes', r.id));
    goList();
  }catch(e){
    console.error(e);
    alert('Could not delete recipe.');
  }
}

async function reassignRecipes(fromName, toName){
  if (!toName || !toName.trim()) return;
  const toReassign = recipes.filter(r => (r.addedBy||'').trim() === fromName.trim());
  if (!toReassign.length){
    alert('No recipes to move.');
    return;
  }
  if (!confirm(`Move ${toReassign.length} recipe${toReassign.length===1?'':'s'} from ${fromName} to ${toName}?`)) return;
  for (const r of toReassign){
    try{ await setDoc(doc(db, 'recipes', r.id), { addedBy: toName }, { merge: true }); }catch(e){ console.error(e); }
  }
}

async function deleteAllRecipesForUser(name){
  const toDelete = recipes.filter(r => (r.addedBy||'').trim() === name.trim());
  if (!toDelete.length) return;
  for (const r of toDelete){
    try{
      if (r.ownPhotoUrl) await deleteOwnPhoto(r.id);
      await deleteDoc(doc(db, 'recipes', r.id));
    }catch(e){ console.error(e); }
  }
}

async function removeUser(name){
  if (!confirm(`Remove ${name}? Their recipes will be deleted too.`)) return;
  try{
    await deleteAllRecipesForUser(name);
    await setDoc(doc(db,'meta','roster'), { names: arrayRemove(name) }, { merge:true });
  }catch(e){
    console.error(e);
    alert('Could not remove user.');
  }
}

// BUG FIX #6: Improved handleGenerateGrocery with better error messages
async function handleGenerateGrocery(){
  const items = state.recipes.filter(r => state.mealPlanIds.includes(r.id));
  const lines = [];
  items.forEach(r => (r.ingredients||[]).forEach(i => lines.push({ text: i, from: r.title })));
  window.__groceryChecked = new Set();
  
  if (!lines.length){
    state.groceryItems = [];
    state.groceryError = null;
    state.view = 'grocery';
    render();
    return;
  }
  
  state.view = 'grocery';
  state.groceryLoading = true;
  state.groceryError = null;
  render();
  
  try{
    state.groceryItems = await aggregateGroceryItems(lines);
  }catch(e){
    console.error('Aggregation error:', e);
    // Fall back to a plain grouped (non-aggregated) list so the feature still works
    const grouped = {};
    lines.forEach(l => {
      const key = l.text.trim().toLowerCase();
      if (!grouped[key]) grouped[key] = { text: l.text, sources: [] };
      if (!grouped[key].sources.includes(l.from)) grouped[key].sources.push(l.from);
    });
    state.groceryItems = Object.values(grouped).sort((a,b) => a.text.localeCompare(b.text));
    state.groceryError = "Couldn't combine quantities automatically this time — showing items separately instead.";
  }
  state.groceryLoading = false;
  render();
}

async function handlePasteExtract(){
  const txt = document.getElementById('pasteInput')?.value;
  if (!txt || !txt.trim()){ alert('Paste some recipe text first.'); return; }
  state.extractStatus = {type:'loading', msg:'Reading recipe text…'};
  render();
  try{
    const result = await extractFromText(txt);
    if (!result.title){
      state.extractStatus = {type:'error', msg:'Could not find a recipe in that text. Try a different source?'};
      render();
      return;
    }
    state.form.title = result.title;
    state.form.ingredients = result.ingredients || [];
    state.form.ingredientsText = (result.ingredients||[]).join('\n');
    state.form.instructions = result.instructions || [];
    state.form.instructionsText = (result.instructions||[]).join('\n');
    state.form.category = result.category || null;
    state.extractStatus = null;
    render();
  }catch(e){
    console.error(e);
    state.extractStatus = {type:'error', msg:e.message};
    render();
  }
}

async function handleExtract(){
  const url = document.getElementById('urlInput')?.value;
  if (!url || !url.trim()){ alert('Paste a URL first.'); return; }
  state.extractStatus = {type:'loading', msg:'Reading website…'};
  render();
  try{
    const result = await extractFromUrl(url);
    if (!result.title){
      state.extractStatus = {type:'error', msg:'Could not find a recipe on that page. Try another source?'};
      render();
      return;
    }
    state.form.title = result.title;
    state.form.sourceUrl = url;
    state.form.sourceImageUrl = result.imageUrl || null;
    state.form.ingredients = result.ingredients || [];
    state.form.ingredientsText = (result.ingredients||[]).join('\n');
    state.form.instructions = result.instructions || [];
    state.form.instructionsText = (result.instructions||[]).join('\n');
    state.form.category = result.category || null;
    state.extractStatus = null;
    render();
  }catch(e){
    console.error(e);
    state.extractStatus = {type:'error', msg:e.message};
    render();
  }
}

async function handleScan(file){
  state.extractStatus = {type:'loading', msg:'Reading photo…'};
  render();
  try{
    const b64 = await resizeImageFile(file);
    const result = await extractFromImage(b64, 'image/jpeg');
    if (!result.title){
      state.extractStatus = {type:'error', msg:'Could not read a recipe from that image.'};
      render();
      return;
    }
    state.form.title = result.title;
    state.form.ownPhotoDataUrl = b64;
    state.form.chosenPhoto = 'own';
    state.form.ingredients = result.ingredients || [];
    state.form.ingredientsText = (result.ingredients||[]).join('\n');
    state.form.instructions = result.instructions || [];
    state.form.instructionsText = (result.instructions||[]).join('\n');
    state.form.category = result.category || null;
    state.extractStatus = null;
    render();
  }catch(e){
    console.error(e);
    state.extractStatus = {type:'error', msg:e.message};
    render();
  }
}

async function resizeImageFile(file){
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxDim = 1200;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim){
          const ratio = Math.min(maxDim/w, maxDim/h);
          w = w * ratio; h = h * ratio;
        }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        res(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => rej(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = () => rej(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

function openDetail(id){
  const r = state.recipes.find(x => x.id === id);
  if (r){ state.detail = r; state.view = 'detail'; render(); }
}

async function openShareForDetail(){
  const r = state.detail;
  if (!r) return;
  const text = `Check out "${r.title}" in the family recipe box! ${window.location.href}`;
  state.shareModal = {title:r.title, text};
  render();
}

function toggleMealPlan(recipeId){
  const has = state.mealPlanIds.includes(recipeId);
  state.mealPlanIds = has ? state.mealPlanIds.filter(id => id !== recipeId) : [...state.mealPlanIds, recipeId];
  const uid = auth.currentUser.uid;
  setDoc(doc(db, 'mealplans', uid), { recipeIds: state.mealPlanIds }, { merge: true }).catch(e => console.error(e));
  render();
}

/* ---- Event listeners ---- */
document.addEventListener('click', async (e) => {
  const t = e.target;

  if (t.id === 'startBtn'){
    const name = document.getElementById('nameInput')?.value;
    if (!name || !name.trim()){ alert('Enter your name first.'); return; }
    state.profile = { name: name.trim() };
    saveProfile(state.profile);
    state.recipes = [];
    startRecipeSync();
    startRosterSync();
    startCategoriesSync();
    startMealPlanSync(auth.currentUser.uid);
    registerInRoster(state.profile.name);
    render();
    return;
  }

  if (t.id === 'extractBtn'){ handleExtract(); return; }
  if (t.id === 'pasteExtractBtn'){ handlePasteExtract(); return; }
  if (t.id === 'scanBtn'){ document.getElementById('scanInput')?.click(); return; }
  if (t.id === 'saveBtn'){ handleSave(); return; }
  if (t.id === 'removeOwnPhoto'){ state.form.ownPhotoDataUrl = null; state.form.chosenPhoto = 'source'; render(); return; }
  if (t.id === 'addCatBtn'){
    const input = document.getElementById('newCatInput');
    const name = input?.value;
    if (!name || !name.trim()){ alert('Enter a category name.'); return; }
    createCategory(name);
    input.value = '';
    return;
  }

  const tab = t.closest('[data-tab]');
  if (tab){ state.view = tab.dataset.tab; render(); return; }

  const textSizeBtn = t.closest('[data-textsize]');
  if (textSizeBtn){
    const size = textSizeBtn.dataset.textsize;
    state.textSize = size;
    saveTextSize(size);
    return;
  }

  const back = t.closest('[data-back]');
  if (back){ const v = back.dataset.back; if (v === 'list'){ goList(); }else{ state.view = v; render(); } return; }

  const photoOpt = t.closest('[data-choosephoto]');
  if (photoOpt){ state.form.chosenPhoto = photoOpt.dataset.choosephoto; render(); return; }

  const switchPhoto = t.closest('[data-switchphoto]');
  if (switchPhoto){ state.detail.chosenPhoto = switchPhoto.dataset.switchphoto; render(); return; }

  const filterBtn = t.closest('[data-filter]');
  if (filterBtn){ state.filter = filterBtn.dataset.filter; render(); return; }

  // BUG FIX #5: Check toggleplan BEFORE open to prevent accidental opens
  const togglePlan = t.closest('[data-toggleplan]');
  if (togglePlan){ toggleMealPlan(togglePlan.dataset.toggleplan); return; }

  const openBtn = t.closest('[data-open]');
  if (openBtn){ openDetail(openBtn.dataset.open); return; }

  const openCat = t.closest('[data-open-category]');
  if (openCat){ state.categoryFilter = openCat.dataset.openCategory; state.filter = 'all'; state.view = 'list'; render(); return; }

  if (t.closest('[data-clear-category]')){ state.categoryFilter = null; render(); return; }

  if (t.id === 'groceryBtn'){ handleGenerateGrocery(); return; }

  const groceryToggle = t.closest('[data-grocery-toggle]');
  if (groceryToggle){
    if (!window.__groceryChecked) window.__groceryChecked = new Set();
    const idx = groceryToggle.dataset.groceryToggle;
    if (window.__groceryChecked.has(idx)){ window.__groceryChecked.delete(idx); }else{ window.__groceryChecked.add(idx); }
    render();
    return;
  }

  if (t.id === 'changeNameBtn'){
    const val = prompt('Your first name', state.profile.name);
    if (val && val.trim()){ state.profile.name = val.trim(); saveProfile(state.profile); registerInRoster(state.profile.name); render(); }
    return;
  }

  if (t.id === 'shareAppBtn'){
    const url = window.location.href.split('?')[0];
    try{ await navigator.clipboard.writeText(url); t.textContent='Copied ✓'; setTimeout(()=>{t.textContent='Copy app link';},1500); }
    catch(e){ prompt('Copy this link:', url); }
    return;
  }

  if (t.id === 'closeShareBtn' || t.id === 'modalBg'){
    if (t.id === 'modalBg' && e.target !== t) return;
    state.shareModal = null; render(); return;
  }

  if (t.closest('[data-action="edit"]')){
    const r = state.detail;
    state.form = { title:r.title, sourceUrl:r.sourceUrl, sourceImageUrl:r.sourceImageUrl, ownPhotoDataUrl:r.ownPhotoUrl, chosenPhoto:r.chosenPhoto, ingredients:r.ingredients, instructions:r.instructions, ingredientsText:(r.ingredients||[]).join('\n'), instructionsText:(r.instructions||[]).join('\n'), category:r.category||null, addedBy:r.addedBy };
    state.editingId = r.id; state.extractStatus = null; state.view = 'add'; render(); return;
  }
  if (t.closest('[data-action="delete"]')){ handleDelete(); return; }
  if (t.closest('[data-action="share"]')){ openShareForDetail(); return; }

  const removeUserBtn = t.closest('[data-remove-user]');
  if (removeUserBtn){ removeUser(removeUserBtn.dataset.removeUser); return; }
});

document.addEventListener('change', async (e) => {
  if (e.target.id === 'photoInput' && e.target.files[0]){
    try{
      const b64 = await resizeImageFile(e.target.files[0]);
      state.form.ownPhotoDataUrl = b64;
      state.form.chosenPhoto = 'own';
      render();
    }catch(err){ alert('Could not read that photo — try another.'); }
  }
  if (e.target.id === 'scanInput' && e.target.files[0]){
    handleScan(e.target.files[0]);
    e.target.value = '';
  }
  if (e.target.id === 'categorySelect'){ state.form.category = e.target.value || null; }
  if (e.target.id === 'ownerSelect'){ state.form.addedBy = e.target.value; }
  const reassignSel = e.target.closest('[data-reassign-from]');
  if (reassignSel){
    const from = reassignSel.dataset.reassignFrom;
    const to = reassignSel.value;
    reassignSel.value = '';
    reassignRecipes(from, to);
  }
});

// BUG FIX #1-4: Sync form inputs to state on EVERY change to prevent data loss
document.addEventListener('input', (e) => {
  if (e.target.id === 'nameInput'){
    document.getElementById('startBtn').disabled = !e.target.value.trim();
  }
  if (e.target.id === 'searchInput'){
    state.query = e.target.value;
    render();
  }
  if (e.target.id === 'titleInput'){ 
    state.form.title = e.target.value;
    e.stopPropagation();
  }
  if (e.target.id === 'ingInput'){ 
    state.form.ingredientsText = e.target.value;
    e.stopPropagation();
  }
  if (e.target.id === 'stepInput'){ 
    state.form.instructionsText = e.target.value;
    e.stopPropagation();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'nameInput'){
    document.getElementById('startBtn').click();
  }
});
